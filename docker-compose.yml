services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satyameva_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SATYAMEVA_ENV=production
      - SECRET_KEY=satyameva-prod-secret-key-blockchain-2026
      - DATABASE_URL=postgresql://satyameva_user:satyameva_secure_pass@db:5432/satyameva_db
      - TRUST_PROXY_HEADERS=true
      - POW_DIFFICULTY=4
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=true
      - MAIL_DEFAULT_SENDER=noreply@satyameva.edu
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - satyameva_instance:/app/instance

  db:
    image: postgres:15-alpine
    container_name: satyameva_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: satyameva_user
      POSTGRES_PASSWORD: satyameva_secure_pass
      POSTGRES_DB: satyameva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satyameva_user -d satyameva_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  satyameva_instance:
