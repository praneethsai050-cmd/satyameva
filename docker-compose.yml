version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satyameva_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SATYAMEVA_ENV=production
      - DATABASE_URL=postgresql://satyameva_user:satyameva_secure_password@db:5432/satyameva_db
      - SECRET_KEY=satyameva-production-secret-key-blockchain-2026
      - POW_DIFFICULTY=4
      - QR_TOKEN_TTL_SECONDS=60
      - TRUST_PROXY_HEADERS=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - satyameva_instance:/app/instance
    networks:
      - satyameva_net

  db:
    image: postgres:15-alpine
    container_name: satyameva_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=satyameva_user
      - POSTGRES_PASSWORD=satyameva_secure_password
      - POSTGRES_DB=satyameva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satyameva_user -d satyameva_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - satyameva_net

volumes:
  postgres_data:
  satyameva_instance:

networks:
  satyameva_net:
    driver: bridge
