services:
  - type: web
    name: satyameva-aegis
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 run:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SATYAMEVA_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
